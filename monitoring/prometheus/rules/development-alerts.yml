# 초기 운영 가설이며 확정 SLO가 아니다. 근거·담당자 확인 항목은 docs/monitoring-metrics-contract.md.
# 이 규칙이 for 시간을 판정하고 Grafana가 ALERTS를 Discord에 전달한다. Alertmanager는 추가하지 않는다.
# 타깃을 등록하지 않은 파트에는 알리지 않는다. up=0은 기존 수집 실패 알림이 담당한다.
groups:
  - name: keepgo-development-alerts
    rules:
      - alert: KeepGoDevHttpMetricsMissing
        expr: |
          (up{job="application-dev",metrics_contract="v1"} == 1)
          unless on (environment, cluster, service, instance)
          (keepgo_observability_info{job="application-dev",contract="1",capability="http"} == 1)
        for: 10m
        labels: {scope: development, severity: warning, signal: http_metrics_missing}
        annotations:
          summary: Development HTTP capability is missing. Counters may be absent before the first request.
      - alert: KeepGoDevHttp5xxHigh
        expr: |
          (keepgo_dev:http_5xx:ratio5m > 0.05)
          and on (environment, cluster, service) (sum by (environment, cluster, service) (keepgo_dev:http_requests:increase5m) >= 20)
          and on (environment, cluster, service) (sum by (environment, cluster, service) (keepgo_dev:http_requests:increase5m{status=~"5.."}) >= 5)
        for: 5m
        labels: {scope: development, severity: warning, signal: http_5xx}
        annotations:
          summary: HTTP 5xx exceeds 5 percent with at least 20 requests and 5 errors in the rolling 5 minute window.
      # 전체 요청 p95에 느린 생성/스트리밍을 섞지 않는다. 각 class에서 최소 100건을 요구한다.
      - alert: KeepGoDevHttpLatencyHigh
        expr: |
          ((keepgo_dev:http_duration:p95_5m{traffic_class="interactive"} > 2)
           or (keepgo_dev:http_duration:p95_5m{traffic_class="generation"} > 30))
          and on (environment, cluster, service, traffic_class)
          (sum by (environment, cluster, service, traffic_class) (keepgo_dev:http_requests:increase5m) >= 100)
        for: 10m
        labels: {scope: development, severity: warning, signal: http_latency}
        annotations:
          summary: HTTP p95 exceeds the initial class budget (interactive 2s, generation 30s); streaming is excluded.
      - alert: KeepGoDevJvmHeapHigh
        expr: keepgo_dev:jvm_heap:ratio > 0.85
        for: 15m
        labels: {scope: development, severity: warning, signal: jvm_heap}
        annotations:
          summary: JVM heap usage exceeds 85 percent for 15 minutes; correlate with GC before changing limits.
      - alert: KeepGoDevDbPoolSaturated
        expr: |
          (keepgo_dev:db_pool:ratio > 0.9)
          and on (environment, cluster, service, instance, pool)
          (hikaricp_connections_pending{job="application-dev",metrics_contract="v1"} > 0)
        for: 5m
        labels: {scope: development, severity: warning, signal: db_pool}
        annotations:
          summary: DB pool exceeds 90 percent usage with waiting callers for 5 minutes.
      - alert: KeepGoDevDbConnectionTimeout
        expr: sum by (environment, cluster, service) (increase(hikaricp_connections_timeout_total{job="application-dev",metrics_contract="v1"}[5m])) >= 3
        for: 2m
        labels: {scope: development, severity: warning, signal: db_timeout}
        annotations:
          summary: At least 3 DB connection acquisition timeouts in the rolling 5 minute window.
      - alert: KeepGoDevAiProviderErrors
        expr: |
          (keepgo_dev:ai_provider_errors:ratio5m > 0.1)
          and on (environment, cluster, service, provider, model)
          (sum by (environment, cluster, service, provider, model) (increase(keepgo_ai_provider_requests_total{job="application-dev",metrics_contract="v1",outcome!="cancelled"}[5m])) >= 20)
          and on (environment, cluster, service, provider, model)
          (sum by (environment, cluster, service, provider, model) (increase(keepgo_ai_provider_requests_total{job="application-dev",metrics_contract="v1",outcome=~"error|timeout|rate_limited"}[5m])) >= 5)
        for: 5m
        labels: {scope: development, severity: warning, signal: ai_provider_errors}
        annotations:
          summary: AI provider attempt failures exceed 10 percent, with at least 20 attempts and 5 failures per 5 minutes.
      - alert: KeepGoDevAiFirstTokenSlow
        expr: |
          (histogram_quantile(0.95, sum by (environment, cluster, service, provider, model, le) (rate(keepgo_ai_first_token_seconds_bucket{job="application-dev",metrics_contract="v1"}[10m]))) > 5)
          and on (environment, cluster, service, provider, model)
          (sum by (environment, cluster, service, provider, model) (increase(keepgo_ai_first_token_seconds_count{job="application-dev",metrics_contract="v1"}[10m])) >= 20)
        for: 10m
        labels: {scope: development, severity: warning, signal: ai_first_token}
        annotations:
          summary: Successful streaming first-token p95 exceeds 5 seconds with at least 20 observations per 10 minutes.

      - alert: KeepGoDevScrapeDown
        expr: up{job="application-dev"} == 0
        for: 3m
        labels: {scope: development, severity: warning, signal: scrape_down}
        annotations:
          summary: Development metrics endpoint is unreachable for 3 minutes.
      - alert: KeepGoDevTargetMissing
        expr: |
          absent(up{job="application-dev",environment="development",cluster="keepgo-v2",service="backend"})
          or absent(up{job="application-dev",environment="development",cluster="keepgo-v2",service="ai-api"})
        for: 5m
        labels: {scope: development, severity: warning, signal: target_missing}
        annotations:
          summary: Expected development service has no running scrape target.
      - alert: KeepGoDevDiscoveryStale
        expr: |
          (time() - prometheus_sd_file_mtime_seconds{filename="/etc/prometheus/targets/development.json"} > 180)
          or absent(prometheus_sd_file_mtime_seconds{filename="/etc/prometheus/targets/development.json"})
        for: 2m
        labels: {scope: development, environment: development, cluster: keepgo-v2, severity: warning, signal: discovery_stale}
        annotations:
          summary: Development discovery file has not refreshed; inspect keepgo-dev-metrics.timer.
