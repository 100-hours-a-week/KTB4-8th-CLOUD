# keepgo-app 공통 차트 기본값
# 5-3(리소스·확장·보안 정책)과 5-4(배포 자동화) 위키를 기본값으로 담는다.
# 기본값은 핵심 Spring API 기준이다. ai-api·web·worker는 서비스별 values에서 필요한 부분만 덮어쓴다.
#
# 값의 소유(5-4 7.4)
#   각 팀   : image.tag, env, resources, replicaCount, 확장 임계값
#   플랫폼팀 : probes 기본값, 종료 절차, strategy, securityContext, 공통 라벨, 배치 규칙

# 리소스 이름. 비우면 릴리스 이름을 그대로 쓴다(예: auth-api).
# Pod Identity 연결이 ServiceAccount 이름 기준이므로 릴리스 이름을 바꾸면 Terraform 쪽도 바꿔야 한다.
nameOverride: ""
fullnameOverride: ""

# 실행 단위 종류. 라벨(app.kubernetes.io/component)에만 쓰인다. api | worker | web
component: api

image:
  # 필수. 서비스별 ECR 저장소(5-4 4.3). 예: <계정>.dkr.ecr.ap-northeast-2.amazonaws.com/keepgo-auth-api
  repository: ""
  # 필수. 커밋 SHA. latest는 쓰지 않는다(5-4 4.3).
  tag: ""
  pullPolicy: IfNotPresent

# ECR은 노드 IAM 역할로 받으므로 보통 비워 둔다.
imagePullSecrets: []

# autoscaling.type: none 일 때만 쓴다. HPA·KEDA를 쓰면 차트가 replicas를 그리지 않는다(5-4 6.4).
replicaCount: 1

# Pod 수 자동 조절(5-3 5.2·5.4·5.5)
#   none : replicaCount 고정
#   hpa  : CPU 사용률 기준 (auth·member·youtube·wishlist)
#   keda : 이벤트 기준 (worker: SQS, chat·recommend: SSE 연결 수, ai-api: 처리 중 요청 수)
# 한 Deployment에 HPA와 KEDA를 같이 걸지 않는다(KEDA가 HPA를 만들기 때문).
autoscaling:
  type: none
  # KEDA는 0까지 가능(worker). HPA는 1 이상.
  minReplicas: 2
  # 최대값은 DB 커넥션 예산(5-3 3.4)과 외부 AI 한도 안에서 서비스 values로 정한다.
  maxReplicas: 4
  hpa:
    # requests.cpu 대비 비율. CPU limit이 없으므로 100%를 넘을 수 있다(5-3 3.5).
    targetCPUUtilizationPercentage: 70
  keda:
    # 지표를 읽는 주기(초). 기본 30초 = worker Cold Start의 첫 단계(5-3 5.5)
    pollingInterval: 30
    # 마지막 트리거 활성 후 0으로 줄이기까지 기다리는 시간(초). minReplicas가 0일 때만 의미가 있다.
    cooldownPeriod: 300
    # KEDA 트리거 정의를 그대로 쓴다. useAuthentication: true를 적으면 아래 TriggerAuthentication이 붙는다.
    triggers: []
    #  - type: aws-sqs-queue
    #    useAuthentication: true
    #    metadata:
    #      queueURL: https://sqs.ap-northeast-2.amazonaws.com/<계정>/<큐>
    #      queueLength: "5"
    #      awsRegion: ap-northeast-2
    authentication:
      enabled: false
      podIdentity:
        provider: aws
        # 서비스 자기 ServiceAccount의 IAM 역할로 지표를 읽는다. KEDA 운영자에게 넓은 AWS 권한을 주지 않는다.
        identityOwner: workload
  # 확장·축소 속도. JVM 기동 직후 CPU 급증으로 과잉 확장되지 않게 올라갈 때도 60초 지켜보고,
  # 내려갈 때는 5분 동안 낮게 유지돼야 1개씩 줄인다(5-3 5.4, SSE는 끊김 최소화).
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

# 노드 교체 같은 계획된 중단에서 동시에 내려갈 수 있는 Pod 수(5-3 6.9).
# 평소 최소 Pod 수가 2 이상일 때만 만든다. worker는 끈다(재처리로 복구).
pdb:
  enabled: true
  maxUnavailable: 1

# 이미지의 ENTRYPOINT·CMD를 덮어쓸 때만 쓴다. 예: ai-api의 uvicorn 실행 명령
command: []
args: []

# 컨테이너가 여는 포트. 이름은 Service·Probe에서 참조하므로 바꾸지 않는다.
#   http       : 앱 트래픽(Spring 8080)
#   management : 헬스·지표 전용(Spring Actuator 8081). 외부에 노출하지 않는다(5-3 4.3).
containerPorts:
  - name: http
    port: 8080
  - name: management
    port: 8081

service:
  # worker처럼 요청을 받지 않는 서비스는 false로 둔다.
  enabled: true
  type: ClusterIP
  # 클러스터 안에서 부르는 포트. 예: http://auth-api.account/ → Pod의 http(8080)
  ports:
    - name: http
      port: 80
      targetPort: http
  annotations: {}

# 일반 환경변수. 이름: 값 형태의 맵이라 환경별 values에서 키 단위로 덮어쓸 수 있다.
# 값을 바꾸면 Pod 정의가 바뀌어 자동으로 롤링 재시작된다(ConfigMap처럼 checksum이 필요 없다).
# 기본값을 빼려면 서비스 values에서 null로 둔다.
env:
  # application.yaml의 root 로그 기본값이 TRACE다. 로그가 쏟아지면 앱이 멈춘 적이 있어 INFO로 내린다.
  LOGGING_LEVEL: INFO
  # 힙 상한을 컨테이너 메모리의 70%로 맞춘다. 나머지는 Metaspace·Thread Stack 등 Native 메모리용(5-3 3.2).
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
  # TLS는 ALB에서 끝나므로 X-Forwarded-* 헤더로 원래 https 주소를 복원한다.
  SERVER_FORWARD_HEADERS_STRATEGY: native
  # SIGTERM 후 진행 중인 요청을 끝내고 내려간다(5-3 4.5). preStop 10초 + 25초 < 종료 상한 40초
  # (Spring 환경변수 규칙상 timeout-per-shutdown-phase는 하이픈 없이 TIMEOUTPERSHUTDOWNPHASE로 쓴다)
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUTPERSHUTDOWNPHASE: 25s
  # liveness·readiness 그룹을 명시적으로 켠다(쿠버네티스에서는 자동이지만 앱 설정에 없어서 분명히 둔다, 5-3 4.3).
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  # p95 알림·대시보드용 히스토그램(기본은 꺼져 있다)
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"

# valueFrom 등 맵으로 표현하기 어려운 환경변수. 쿠버네티스 env 형식 그대로 쓴다.
extraEnv: []
#  - name: POD_NAME
#    valueFrom:
#      fieldRef:
#        fieldPath: metadata.name

# ConfigMap·Secret 전체를 환경변수로 넣는다. Secret은 ExternalSecret이 만든 것을 가리킨다.
envFrom: []
#  - secretRef:
#      name: auth-api-env

# Secret을 파일로 붙인다. JWT PEM처럼 앱이 파일 경로로 읽는 값에 쓴다.
secretFiles: []
#  - name: jwt
#    secretName: backend-jwt
#    mountPath: /run/secrets
#    items:                     # 생략하면 Secret의 모든 키가 파일이 된다
#      - key: JWT_PUBLIC_KEY
#        path: jwt_public_key.pem

# External Secrets Operator로 AWS Secrets Manager 값을 쿠버네티스 Secret으로 받는다(5-3 2.3, 5-4 10장).
# 만든 Secret은 envFrom·secretFiles에서 이름으로 쓴다.
externalSecrets:
  # Secrets Manager 값을 다시 읽는 주기. 바뀐 값은 Secret에는 반영되지만 Pod는 재시작해야 읽는다(5-4 7.6).
  refreshInterval: 1h
  # tenancy 차트가 Namespace마다 만드는 SecretStore
  storeRef:
    kind: SecretStore
    name: aws-secrets-manager
  # 만들어지는 Secret 이름은 "<서비스>-<name>"(예: auth-api-env)
  items: []
  #  - name: env
  #    asEnv: true                       # 모든 키를 환경변수로
  #    data:
  #      - secretKey: GOOGLE_CLIENT_SECRET
  #        remoteRef: { key: keepgo/dev3/backend, property: GOOGLE_CLIENT_SECRET }
  #  - name: jwt
  #    asFiles:                          # 파일로 마운트
  #      mountPath: /run/secrets/jwt
  #      items: [{ key: JWT_PUBLIC_KEY, path: jwt_public_key.pem }]
  #    data:
  #      - secretKey: JWT_PUBLIC_KEY
  #        remoteRef: { key: keepgo/dev3/backend, property: JWT_PUBLIC_KEY }
  #    # 비밀 하나의 모든 키를 그대로 받으려면: dataFrom: [{ extract: { key: keepgo/dev3/backend } }]

# DB 스키마 마이그레이션 Job(5-4 8.3). Argo CD PreSync로 새 버전보다 먼저 실행된다.
# 지금 backend에는 Flyway 스크립트(db/migration)가 없어 모든 서비스에서 꺼 둔다.
migration:
  enabled: false
  # 비우면 앱 이미지와 같은 이미지·태그를 쓴다. CI가 같은 커밋으로 만든 마이그레이션 이미지를 쓰려면 채운다.
  image:
    repository: ""
    tag: ""
  command: []
  args: []
  env: {}
  # DDL 권한 DB 계정을 담은 externalSecrets.items[].name. 이 항목은 PreSync로 먼저 만들어진다.
  externalSecret: ""
  backoffLimit: 1
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 512Mi

# 앱이 파일로 읽는 설정(파일 이름: 내용). ConfigMap으로 만들어 mountPath에 붙인다.
configFiles:
  mountPath: /config
  files: {}

# 쓰기가 필요한 경로(읽기 전용 루트 파일시스템 예외). Pod가 지워지면 내용도 지워진다.
# 예) ai-api의 내장 벡터 저장소: - { name: chroma, mountPath: /app/chroma, sizeLimit: 1Gi }
extraVolumes: []

# 쓰기 가능한 /tmp. 루트 파일시스템을 읽기 전용으로 두므로 Tomcat·Python 임시 파일용으로 필요하다.
tmpDir:
  enabled: true
  sizeLimit: 256Mi

# 헬스체크(5-3 4.3·4.4). 쿠버네티스(kubelet)가 직접 HTTP로 확인하므로 이미지에 curl이 없어도 된다.
# preset이 경로·포트·횟수 기본값을 정하고, 아래 startup/readiness/liveness에 적은 값만 덮어쓴다.
#   spring  : management /actuator/health/liveness·readiness, startup 최대 150초
#   fastapi : http /health/live·/health/ready, startup 최대 60초
#   nextjs  : http /, startup 최대 60초
# 예) worker는 Service가 없으므로 readiness를 끈다:  readiness: { enabled: false }
probes:
  preset: spring
  startup: {}
  readiness: {}
  liveness: {}

# 종료 처리(5-3 4.5·4.6)
# 1) preStop 동안 대기 → 그 사이 Service·ALB 대상에서 빠진다(새 요청이 안 들어오게).
# 2) SIGTERM → 앱이 처리 중인 요청을 마무리한다.
# 3) terminationGracePeriodSeconds가 지나면 강제 종료. preStop 시간도 여기에 포함된다.
# 일반 API: 10초 + 요청 정리 30초. SSE·worker는 서비스별 values에서 늘린다.
lifecycle:
  preStopSleepSeconds: 10
terminationGracePeriodSeconds: 40

# 배포 방식(5-3 5.3). 핵심 API 기준: 새 Pod가 Ready가 된 뒤에 기존 Pod를 내린다.
# worker는 쿠버네티스 기본값(25%/25%)을 쓰도록 서비스 values에서 덮어쓴다.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# 이 시간 안에 새 Pod가 Ready가 안 되면 배포 실패(Progressing=False)로 표시되고
# Argo CD가 Degraded로 알린다(5-4 9.1). Spring 기동 시간을 측정한 뒤 조정한다.
progressDeadlineSeconds: 600

# 롤백용으로 남길 이전 ReplicaSet 개수
revisionHistoryLimit: 5

# 필수. 기본값을 두지 않는다(5-4 7.3). 빠지면 렌더링이 실패해 GitOps CI에서 걸린다.
# 규칙(5-3 3.2)
#   - requests.cpu, requests.memory, limits.memory 모두 필요
#   - 메모리는 requests = limits (노드 메모리 오버커밋 방지)
#   - CPU limit은 걸지 않는다 (스로틀링·Spring 기동 지연 방지)
# 서비스별 초기값은 5-3 3.3 표를 따른다. 예) auth-api: cpu 250m, memory 768Mi
resources: {}

serviceAccount:
  # 서비스마다 ServiceAccount를 만든다(5-4 7.2). AWS 권한은 EKS Pod Identity로 연결한다.
  # Pod Identity는 Terraform의 association(네임스페이스 + ServiceAccount 이름 → IAM 역할)으로 붙으므로
  # annotation이 필요 없다. 이름만 서로 맞추면 된다.
  create: true
  # 비우면 리소스 이름(릴리스 이름)을 쓴다.
  name: ""
  annotations: {}
  # 앱이 쿠버네티스 API를 쓰지 않으므로 토큰을 붙이지 않는다.
  # Pod Identity는 별도 토큰을 쓰므로 이 값과 무관하다.
  automountToken: false

podAnnotations: {}
podLabels: {}

# 보안 설정. Backend 이미지는 UID 10001(app)로 실행된다.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# 자원이 부족할 때 누구를 먼저 살릴지(5-3 6.6). 이름은 gitops/platform/priority-classes에 정의한다.
#   keepgo-high    : auth-api, chat-api, recommend-api, ai-api, redis
#   keepgo-default : member-api, youtube-api, wishlist-api (기본값)
#   keepgo-low     : youtube-analysis-worker
priorityClassName: keepgo-default

# 노드 배치. Karpenter NodePool의 Label·Taint는 A 담당 확정 후 환경별 values에 채운다(5-3 6.3).
#   Application NodePool: auth·member·youtube·wishlist·chat·recommend·ai-api
#   Worker NodePool     : youtube-analysis-worker (Spot, Taint)
nodeSelector: {}
tolerations: []
affinity: {}

# Pod 분산(5-3 6.6). 선택 라벨은 템플릿이 자동으로 채운다.
topologySpread:
  # 노드 기준 Soft: 노드 하나가 죽어도 Replica가 같이 내려가지 않게 고르게 나눈다.
  # 못 나눠도 일단 띄운다(dev처럼 노드가 적을 때 막히지 않게).
  node:
    enabled: true
    maxSkew: 1
  # AZ 기준 Hard: 핵심 API(auth·chat·recommend·ai-api)만 2-AZ 확정 후 켠다.
  # 조건을 못 맞추면 Pod가 Pending이 되므로 필요한 서비스에만 건다(5-3 6.7).
  zone:
    enabled: false
    maxSkew: 1

# 들어오는 통신 허용 목록(5-2 3.4). Namespace 기본 차단은 tenancy 차트가 건다.
networkPolicy:
  enabled: true
  # 앱 포트(http)로 이 서비스를 부르는 내부 서비스. NetworkPolicyPeer 형식 그대로.
  # 예) - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: recommend } }
  #       podSelector: { matchLabels: { app.kubernetes.io/name: chat-api } }
  allowFrom: []
  # ALB가 Pod IP로 직접 보내므로 ALB가 놓인 Public 서브넷 대역을 연다(httpRoute.enabled일 때). 환경별 values에 둔다.
  gatewayCIDRs: []
  # Prometheus가 있는 Namespace. metrics.enabled일 때 지표 포트를 연다. 비우면 열지 않는다.
  monitoringNamespace: monitoring
  # 송신 제한. 비우면 제한하지 않는다. 적으면 DNS 허용이 자동으로 붙는다. NetworkPolicyEgressRule 형식 그대로.
  egress: []

# 외부 노출 경로(5-2 3.4). 공통 Gateway는 A가 관리하고 여기서는 경로만 연결한다.
httpRoute:
  enabled: false
  # 연결할 Gateway. 환경별 values에 둔다.
  # 예) - { name: keepgo-dev3-gateway, namespace: gateway-system, sectionName: https }
  parentRefs: []
  hostnames: []
  # 이 서비스로 보낼 경로 앞부분. 더 긴 경로가 우선한다.
  pathPrefixes: []
  # ALB 대상 그룹 설정(AWS Load Balancer Controller TargetGroupConfiguration)
  targetGroup:
    enabled: true
    healthCheck:
      # Spring readiness. ai-api·web은 서비스 values에서 바꾼다.
      path: /actuator/health/readiness
      port: 8081
      intervalSeconds: 15
      timeoutSeconds: 5
      healthyThreshold: 2
      unhealthyThreshold: 2
      httpCode: "200"
    # Pod가 빠질 때 ALB가 기존 연결을 기다려 주는 시간. preStop(10초)보다 길고 종료 상한(40초)보다 짧게.
    # SSE는 서비스 values에서 재연결 유도 시간에 맞춘다.
    deregistrationDelaySeconds: 30
    # 그 밖의 대상 그룹 속성. 예) - { key: load_balancing.algorithm.type, value: least_outstanding_requests }
    extraAttributes: []

# 지표 수집(PodMonitor). Spring은 관리 포트의 /actuator/prometheus를 쓴다.
metrics:
  enabled: true
  port: management
  path: /actuator/prometheus
  interval: 30s
  # Prometheus가 PodMonitor·PrometheusRule을 고르는 라벨(kube-prometheus-stack 기본은 release 라벨). 환경별 values에 둔다.
  podMonitorLabels: {}

# 서비스 기본 알림(PrometheusRule)
alerts:
  enabled: true
  # 15분 동안 재시작 횟수가 이 값을 넘으면
  restartsIn15m: 3
  # Ready가 아닌 Pod가 이 시간 넘게 있으면(배포 멈춤 포함)
  unavailableFor: 10m
  http:
    # Spring(Micrometer) 기준. 지표가 없는 서비스(ai-api 등)는 끈다.
    enabled: true
    requestsMetric: http_server_requests_seconds
    statusLabel: status
    errorRatio: 0.05
    # SSE처럼 오래 열린 요청은 지연 알림이 의미가 없으므로 서비스 values에서 끈다.
    p95Seconds: 1

# helm test용 연결 확인 Pod. Argo CD는 helm test를 쓰지 않으므로 기본은 끈다(kind·CI에서 켠다).
tests:
  enabled: false
