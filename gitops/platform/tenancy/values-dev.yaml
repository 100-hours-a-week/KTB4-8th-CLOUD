# dev3 클러스터. quota 근거 = 합계(max + surge) x requests (+ 마이그레이션 Job 여유)
#   account  : auth 3 x (250m, 768Mi) + member 3 x (250m, 768Mi) = 1.5 CPU, 4.5Gi
#   ingest   : youtube 3 x (250m, 768Mi) + worker 3 x (500m, 1Gi) = 2.25 CPU, 5.25Gi
#   content  : wishlist 3 x (300m, 1Gi) = 0.9 CPU, 3Gi
#   recommend: chat, recommend 각 3 x (300m, 1Gi) = 1.8 CPU, 6Gi
#   ai       : 3 x (200m, 512Mi) = 0.6 CPU, 1.5Gi
#   frontend : 3 x (100m, 256Mi) = 0.3 CPU, 0.75Gi
cluster: dev3
namespaces:
  account:
    observerGroups: [keepgo:fullstack-observers]
    quota: { requests.cpu: "2", requests.memory: 6Gi, limits.memory: 6Gi, pods: "10" }
  ingest:
    observerGroups: [keepgo:fullstack-observers]
    quota: { requests.cpu: "3", requests.memory: 7Gi, limits.memory: 7Gi, pods: "10" }
  content:
    observerGroups: [keepgo:fullstack-observers]
    quota: { requests.cpu: "1500m", requests.memory: 4Gi, limits.memory: 4Gi, pods: "6" }
  recommend:
    observerGroups: [keepgo:fullstack-observers]
    quota: { requests.cpu: "2500m", requests.memory: 8Gi, limits.memory: 8Gi, pods: "10" }
  ai:
    observerGroups: [keepgo:ai-observers]
    quota: { requests.cpu: "1", requests.memory: 2Gi, limits.memory: 2Gi, pods: "6" }
  frontend:
    observerGroups: [keepgo:fullstack-observers]
    quota: { requests.cpu: "500m", requests.memory: 1Gi, limits.memory: 1Gi, pods: "6" }
