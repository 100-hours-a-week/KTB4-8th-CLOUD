# External Secrets Operator(external-secrets 2.14.0) 설치 값.
# [가정] 설치 소유권 = B(Argo CD 경유). 컨트롤러 역할(Pod Identity association: external-secrets/external-secrets)은 A가 IAM으로 만든다.
# 그 역할은 Secrets Manager를 직접 읽지 않고, Namespace별 역할(keepgo-<env>-eso-<namespace>)을 assume만 한다(tenancy 차트 SecretStore).

installCRDs: true

nodeSelector:
  workload: system
tolerations:
  - { key: workload, operator: Equal, value: system, effect: NoSchedule }
priorityClassName: system-cluster-critical

# partA System 노드 자원 산정값
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 256Mi }

webhook:
  nodeSelector:
    workload: system
  tolerations:
    - { key: workload, operator: Equal, value: system, effect: NoSchedule }
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }

certController:
  nodeSelector:
    workload: system
  tolerations:
    - { key: workload, operator: Equal, value: system, effect: NoSchedule }
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
