# 각 앱 저장소의 .github/workflows/notify-cloud.yaml로 복사해 사용한다.
# workflow_run으로 CI 완료를 확인한다. 게시 단계 안에서 알리면 CI는 아직 실행 중이다.
name: Notify central CD
on:
  workflow_run:
    workflows: [Frontend CI] # 각 저장소에서 허용할 실제 CI 이름을 입력한다.
    types: [completed]
permissions:
  contents: read
jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.CD_APP_ID }}
          private-key: ${{ secrets.CD_APP_PRIVATE_KEY }}
          owner: 100-hours-a-week
          repositories: KTB4-8th-CLOUD
      - name: Notify Cloud after successful main CI
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_GROUP: frontend # backend, worker, ai 중 해당 단위로 변경한다. Backend와 Worker는 따로 알린다.
        run: |
          jq -n --arg group "$RELEASE_GROUP" --arg sha "$SOURCE_SHA" --argjson run_id "$SOURCE_RUN_ID" \
            '{event_type:"image-published",client_payload:{group:$group,sha:$sha,run_id:$run_id}}' > request.json
          gh api repos/100-hours-a-week/KTB4-8th-CLOUD/dispatches --input request.json
