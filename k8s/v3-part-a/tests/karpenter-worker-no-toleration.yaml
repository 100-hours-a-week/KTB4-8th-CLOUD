# Worker Taint의 배치 차단 검증. 정상 기대 결과는 Pending.
# 동일 Worker 노드를 선택하지만 해당 Taint의 toleration은 넣지 않음.
# 먼저 정상 Worker 테스트를 실행한 뒤 잠시 적용하고 제거할 것.
apiVersion: v1
kind: Pod
metadata:
  name: karpenter-worker-no-toleration
  namespace: default
  labels:
    app.kubernetes.io/name: karpenter-worker-no-toleration
spec:
  nodeSelector:
    workload: worker
    karpenter.sh/nodepool: keepgo-dev3-worker
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 10
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
