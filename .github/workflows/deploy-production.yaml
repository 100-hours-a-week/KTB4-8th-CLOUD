name: Deploy production

# main의 Manifest·Compose를 EC2에 반영한다. EC2의 deploy.sh가 바뀐 서비스만 교체·검증하고,
# 실패하면 이전 이미지로 복구한다. 자동 복구가 안 된 경우에만 Discord로 알린다.
on:
  push:  # 사람이 병합한 설정 변경 PR
    branches: [main]
    paths:
      - deployment/production-manifest.json
      - compose.yaml
      - compose.cloudwatch.yaml
      - scripts/deploy.sh
      - scripts/prepare-runtime.py
  workflow_dispatch:  # auto-release.yaml의 호출 또는 수동 재배포

permissions:
  contents: read

concurrency:
  group: keepgo-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    # EC2는 origin main만 fetch한다. Run workflow에서 다른 브랜치를 고르면 배포하지 않고 skip한다(TD-018).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deployment variables
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          INSTANCE_ID: ${{ vars.PRODUCTION_EC2_INSTANCE_ID }}
        run: |
          test -n "${DEPLOY_ROLE_ARN}" || { echo "AWS_DEPLOY_ROLE_ARN is missing" >&2; exit 1; }
          [[ "${INSTANCE_ID}" =~ ^i-[0-9a-f]{8,17}$ ]] || { echo "PRODUCTION_EC2_INSTANCE_ID is invalid" >&2; exit 1; }

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: keepgo-production-deploy

      - name: Verify AWS account
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          test "${ACCOUNT_ID}" = "602601433533" || { echo "Unexpected AWS account: ${ACCOUNT_ID}" >&2; exit 1; }
          echo "AWS_ACCOUNT_ID=${ACCOUNT_ID}" >> "${GITHUB_ENV}"

      - name: Send deployment command to EC2
        id: command
        env:
          INSTANCE_ID: ${{ vars.PRODUCTION_EC2_INSTANCE_ID }}
          CLOUD_SHA: ${{ github.sha }}
        run: |
          parameters="$(jq -nc --arg sha "${CLOUD_SHA}" --arg account "${AWS_ACCOUNT_ID}" --arg region "${AWS_REGION}" \
            '{executionTimeout: ["2400"], commands: [
              "set -euo pipefail",
              "test -d /opt/keepgo/cloud/.git",
              "git -c safe.directory=/opt/keepgo/cloud -C /opt/keepgo/cloud fetch --quiet origin main",
              ("git -c safe.directory=/opt/keepgo/cloud -C /opt/keepgo/cloud checkout --quiet --detach " + $sha),
              ("export CLOUD_COMMIT_SHA=" + $sha + " AWS_ACCOUNT_ID=" + $account + " AWS_REGION=" + $region),
              "bash /opt/keepgo/cloud/scripts/deploy.sh"
            ]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "KeepGo deploy ${CLOUD_SHA:0:12}" \
            --parameters "${parameters}" \
            --query Command.CommandId --output text)"
          echo "id=${COMMAND_ID}" >> "${GITHUB_OUTPUT}"
          echo "SSM Command ID: ${COMMAND_ID}"

      # deploy.sh 종료 코드: 0 성공 / 1 실패했지만 이전 버전으로 복구됨 / 그 외 사람이 확인해야 함
      - name: Wait for deployment result
        id: result
        env:
          INSTANCE_ID: ${{ vars.PRODUCTION_EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.command.outputs.id }}
        run: |
          status=Pending
          for _ in {1..220}; do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "${status}" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          invocation="$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output json)"
          jq -r .StandardOutputContent <<<"${invocation}"
          jq -r .StandardErrorContent <<<"${invocation}" >&2
          code="$(jq -r .ResponseCode <<<"${invocation}")"
          case "${status}:${code}" in
            Success:0) outcome=success ;;
            Failed:1) outcome=rolled_back ;;
            *) outcome=needs_action ;;
          esac
          echo "outcome=${outcome}" >> "${GITHUB_OUTPUT}"
          echo "### 배포 결과: ${outcome} (SSM ${status}, 종료 코드 ${code})" >> "${GITHUB_STEP_SUMMARY}"
          test "${outcome}" = success

      - name: Notify Discord
        if: failure() && steps.result.outputs.outcome != 'rolled_back'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OUTCOME: ${{ steps.result.outputs.outcome || 'not_started' }}
        run: |
          bash scripts/notify-discord.sh "🚨 운영 배포 실패 — 수동 확인 필요" \
            "결과: ${OUTCOME}, Cloud 커밋: ${GITHUB_SHA:0:12}. 자동 복구가 되지 않았거나 배포를 시작하지 못했다. docs/v1-operations.md의 장애 대응 절차를 따른다."
