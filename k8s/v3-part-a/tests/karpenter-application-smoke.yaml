# Application NodePool의 실제 EC2 생성·등록·Pod 실행 검증용
# 적용 시 On-Demand EC2와 루트 EBS가 생성될 수 있음
apiVersion: v1
kind: Pod
metadata:
  name: karpenter-application-smoke
  namespace: default
  labels:
    app.kubernetes.io/name: karpenter-application-smoke
spec:
  # Application 라벨을 가진 노드만 선택
  # 기존 workload=system 노드와 Worker 노드에는 배치하지 않음
  nodeSelector:
    workload: application
    karpenter.sh/nodepool: keepgo-dev3-application
  # 테스트에는 Kubernetes API 자격 증명이 필요하지 않음
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 10
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    # 업무 처리 없이 실행 상태를 유지하는 작은 Kubernetes 공식 이미지
    - name: pause
      image: registry.k8s.io/pause:3.10
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
