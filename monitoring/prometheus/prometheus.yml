global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: production
    cluster: keepgo-v1

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: blackbox
    static_configs:
      - targets: [blackbox-exporter:9115]
  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://web/healthz"]
        labels: {service: web}
      - targets: ["http://frontend:3000/"]
        labels: {service: frontend}
      - targets: ["http://backend:8080/actuator/health"]
        labels: {service: backend}
      - targets: ["http://ai-api:8000/health"]
        labels: {service: ai-api}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  # 앱 팀이 endpoint를 구현하고 내부 접근·외부 차단을 확인한 뒤 JSON에 등록한다.
  - job_name: application
    sample_limit: 10000
    label_limit: 40
    file_sd_configs:
      - files: [/etc/prometheus/targets/application.json]
        refresh_interval: 30s
