        {
          "series": "http_server_requests_seconds_count{job=\"application\",metrics_contract=\"v1\",service=\"backend\",instance=\"backend:8080\",uri=\"/items/{id}\",method=\"GET\",status=\"200\",traffic_class=\"interactive\"}",
          "values": "0+180x40"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "20m",
          "alertname": "KeepGoHttp5xxHigh",
          "exp_alerts": []
        }
      ],
      "promql_expr_test": [
        {
          "expr": "keepgo:http_5xx:ratio5m",
          "eval_time": "10m",
          "exp_samples": [
            {
              "labels": "keepgo:http_5xx:ratio5m{service=\"backend\"}",
              "value": 0
            }
          ]
        },
        {
          "expr": "keepgo:http_requests:rate5m",
          "eval_time": "10m",
          "exp_samples": [
            {
              "labels": "keepgo:http_requests:rate5m{service=\"backend\",route=\"/items/{id}\",method=\"GET\",status=\"200\",traffic_class=\"interactive\"}",
              "value": 3
            }
          ]
        }
      ]
    },
