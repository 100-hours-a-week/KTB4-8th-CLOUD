        {
          "eval_time": "30m",
          "alertname": "KeepGoHttpMetricsMissing",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "KeepGoHttp5xxHigh",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "KeepGoHttpLatencyHigh",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "KeepGoJvmHeapHigh",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "KeepGoDbPoolSaturated",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "KeepGoDbConnectionTimeout",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "KeepGoAiProviderErrors",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "KeepGoAiFirstTokenSlow",
          "exp_alerts": []
        }
      ],
      "promql_expr_test": []
    },
    {
