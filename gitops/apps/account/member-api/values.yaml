# member-api — 회원 정보·프로필 이미지·공개 파일
# 경로·포트 근거: KTB4-8th-BE 컨트롤러, 자원: 5-3 3.3, 확장: 5-3 5.2

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 768Mi

autoscaling:
  type: hpa

# /api는 다른 서비스에 매핑되지 않은 나머지 API를 받는다(같은 이미지라 처리 가능, 웹으로 새지 않게).
httpRoute:
  enabled: true
  pathPrefixes:
    - /api/v1/user
    - /public
    - /api

# web(Next.js)의 서버 쪽 rewrite(/api, /public 등)가 BACKEND_ORIGIN으로 이 서비스를 부른다.
# 브라우저 요청은 HTTPRoute로 바로 오므로 평소에는 거의 쓰이지 않지만, 막아 두면 SSR·rewrite가 실패한다.
networkPolicy:
  allowFrom:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: frontend }
      podSelector:
        matchLabels: { app.kubernetes.io/name: web }
