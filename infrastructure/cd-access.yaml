AWSTemplateFormatVersion: '2010-09-09'
# 적용 보류: S3 리소스를 포함하므로 현재 환경에 그대로 적용하지 않는다.
# EC2 인계 후 전달 방식과 IAM을 수정한다. docs/v1-handoff-2026-09-28.md 참고.
Description: KeepGo v1 중앙 CD 권한과 배포 묶음 저장소 초안
Parameters:
  GitHubRepository:
    Type: String
    Default: 100-hours-a-week/KTB4-8th-CLOUD
  GitHubOidcProviderArn:
    Type: String
  InstanceId:
    Type: AWS::EC2::Instance::Id
  InstanceRoleName:
    Type: String
    Description: AmazonSSMManagedInstanceCore가 있는 기존 EC2 역할 이름. 배포 권한을 추가한다.
  AlertsTopicArn:
    Type: String
  AppSecretArns:
    Type: CommaDelimitedList
    Description: 앱 컨테이너가 사용하는 Secrets Manager의 정확한 ARN 목록. 접미사까지 포함한다.
Resources:
  Bundles:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: BundleRetention
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bundles
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Bundles.Arn, !Sub '${Bundles.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: 'false'}}
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:environment:production'
      Policies:
        - PolicyName: CentralDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}'
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${Bundles.Arn}/releases/*'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertsTopicArn
  VerifyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubRepository}:pull_request'
      Policies:
        - PolicyName: ImageVerification
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:DescribeImages
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/keepgo-*'
  MonitorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
      Policies:
        - PolicyName: ExternalHealthMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition: {StringEquals: {cloudwatch:namespace: KeepGo/V1}}
  HostPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: KeepGoV1Runtime
      Roles: [!Ref InstanceRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action: [ecr:DescribeImages, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
            Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/keepgo-*'
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub '${Bundles.Arn}/releases/*'
          - Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/keepgo/v1/*:*'
          - Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref AppSecretArns
          - Effect: Allow
            Action: sns:Publish
            Resource: !Ref AlertsTopicArn
          - Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: '*'
            Condition: {StringEquals: {cloudwatch:namespace: KeepGo/V1}}
          - Effect: Allow
            Action: cloudwatch:DescribeAlarms
            Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*'
Outputs:
  DeployRoleArn: {Value: !GetAtt DeployRole.Arn}
  VerifyRoleArn: {Value: !GetAtt VerifyRole.Arn}
  MonitorRoleArn: {Value: !GetAtt MonitorRole.Arn}
  DeploymentBucket: {Value: !Ref Bundles}
