# kind 로컬 검증용 Mock API B
# 실제 서비스 values와 같은 차트를 쓰되, 이미지·포트·헬스 경로만 Mock 앱에 맞게 덮어쓴다.
# 설치: helm install mock-b charts/app -n mock --create-namespace -f values/local/mock-b.yaml

image:
  # 어떤 경로로 요청해도 고정 문구를 돌려주는 작은 HTTP 서버
  repository: hashicorp/http-echo
  tag: "1.0"

args:
  - -listen=:8080
  - -text=mock-b

# Mock은 관리 포트가 따로 없어 앱 포트 하나만 연다.
containerPorts:
  - name: http
    port: 8080

# Spring 기본 헬스 경로 대신 앱 포트의 / 로 확인한다.
probes:
  startup:
    path: /
    port: http
    failureThreshold: 6
  readiness:
    path: /
    port: http
  liveness:
    path: /
    port: http

# Spring 전용 환경변수는 Mock에 필요 없으므로 비운다.
env:
  LOGGING_LEVEL: null
  JAVA_TOOL_OPTIONS: null
  SERVER_FORWARD_HEADERS_STRATEGY: null
  MOCK_NAME: mock-b

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 32Mi

# A와 다른 설정이 차트 수정 없이 반영되는지 확인하려고 B만 바꾼 값
service:
  ports:
    - name: http
      port: 8080
      targetPort: http
lifecycle:
  preStopSleepSeconds: 5
terminationGracePeriodSeconds: 20
