name: keepgo-monitoring

x-common: &common
  platform: linux/amd64
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  prometheus:
    <<: *common
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitoring, app-service]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana:
    <<: *common
    image: grafana/grafana:13.2.2
    ports: ["127.0.0.1:3001:3000"]
    networks: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    env_file:
      - path: /opt/keepgo/runtime/monitoring.env
        format: raw
        required: true
    secrets: [grafana_admin_password]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.12.1
    # 컨테이너 자체가 아닌 Linux 호스트의 CPU·메모리·루트 디스크를 읽는다.
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]
    read_only: true
    mem_limit: 128m
    cpus: 0.25

  blackbox-exporter:
    <<: *common
    image: prom/blackbox-exporter:v0.28.0
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    networks: [monitoring, app-web, app-service]
    read_only: true
    mem_limit: 64m
    cpus: 0.25

secrets:
  grafana_admin_password:
    file: /opt/keepgo/runtime/grafana_admin_password

volumes:
  prometheus-data: {}
  grafana-data: {}

networks:
  monitoring: {}
  app-web:
    external: true
    name: keepgo-v1_web
  app-service:
    external: true
    name: keepgo-v1_service
