name: Auto release

# ECR push와 10분 안전망 조회로 앱 저장소의 최신 커밋을 확인한다. CI가 이미지를 게시했고 Manifest와 다르면
# Manifest를 바꾸는 PR을 만들어 바로 병합하고, 배포 workflow를 실행한다. 로직은 scripts/release.sh에 있다.
# 앱 저장소는 모두 공개라 별도 토큰 없이 기본 GITHUB_TOKEN으로 읽는다.
#
# 실행: EventBridge(infrastructure/github-dispatch.yaml)가 workflow_dispatch로 호출한다.
#   - ECR push 이벤트마다 바로 (앱 CI가 이미지를 올린 직후)
#   - 안전망으로 10분마다 (이벤트 유실·호출 실패 대비)
on:
  # 예비용: 이 조직에서는 schedule 이벤트가 발생하지 않는다(TD-022). 실제 주기 실행은 위 EventBridge가 한다.
  # schedule이 복구되면 EventBridge 주기 규칙을 끄고 이쪽으로 되돌린다. 겹쳐도 concurrency로 직렬 실행된다.
  schedule:
    # 기존 EventBridge 주기가 실제 호출 경로이며 schedule은 예비용이다.
    - cron: '7-59/10 * * * *'  # 정각·0분 혼잡을 피한다. 매시 7·17·27·37·47·57분
  workflow_dispatch:
    inputs:
      target:
        description: '조회 대상. all은 환경별 자동 스위치가 켜진 대상만 실행'
        type: choice
        options: [production, v2-dev, all]
        default: all
      dry_run:
        description: '조회만 하고 PR·병합·배포는 하지 않는다 (AUTO_DEPLOY_ENABLED가 꺼져 있어도 실행)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-release-workflow-${{ inputs.target || 'scheduled' }}
  cancel-in-progress: false

jobs:
  release:
    # 자동 배포 전체 스위치. 'true'가 아니면 조회하지 않는다. dry_run은 켜기 전 확인용이라 스위치와 무관하다.
    if: inputs.target != 'v2-dev' && (vars.AUTO_DEPLOY_ENABLED == 'true' || inputs.dry_run)
    concurrency:
      group: auto-release-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # release.sh가 진행 중인 앱 CI를 최대 3분 기다린다
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Find new images and merge manifest PRs
        id: release
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: bash scripts/release.sh

      # GITHUB_TOKEN으로 병합한 커밋은 push 이벤트를 만들지 않으므로 배포를 직접 실행한다.
      # 뒤 저장소에서 오류가 나도 앞에서 병합한 것은 배포한다.
      - name: Start deployment
        if: always() && steps.release.outputs.released == 'true'
        run: gh workflow run deploy-production.yaml --repo "${GITHUB_REPOSITORY}" --ref main

      - name: Notify Discord
        if: failure() && !inputs.dry_run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash scripts/notify-discord.sh "🚨 자동 릴리스 실패" "새 이미지 조회 또는 Manifest PR 병합이 실패했다. 해결될 때까지 자동 배포가 멈춘다."

  release-v2:
    name: Find V2 development images
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.target == 'v2-dev' || inputs.target == 'all') &&
      (vars.V2_AUTO_DEPLOY_ENABLED == 'true' || inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    concurrency:
      group: auto-release-v2-dev
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure V2 AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.V2_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Discover development images
        env:
          RELEASE_TARGET: v2-dev
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: bash scripts/release.sh
      - name: Notify V2 release failure
        if: failure() && !inputs.dry_run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash scripts/notify-discord.sh "V2 개발 릴리스 실패" "개발 이미지 조회·Manifest 병합·배포 호출을 확인하세요."
