# 클러스터 공통 역할(5-2 2.3). 팀 Namespace RoleBinding보다 먼저
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-rbac
  namespace: argocd
  labels:
    keepgo.io/env: dev
    keepgo.io/team: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-8th-CLOUD-GITOPS.git
    targetRevision: main
    path: platform/rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
