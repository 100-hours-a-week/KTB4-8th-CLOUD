# 팀 Namespace, Quota, LimitRange, RoleBinding, SecretStore, 기본 차단(5-2). 앱보다 먼저
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-tenancy
  namespace: argocd
  labels:
    keepgo.io/env: prod
    keepgo.io/team: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/100-hours-a-week/keepgo-gitops.git
    targetRevision: main
    path: platform/tenancy
    helm:
      releaseName: keepgo-tenancy
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
