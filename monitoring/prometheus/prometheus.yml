global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: production
    cluster: keepgo-v1

# 앱 미등록 상태에서도 규칙을 로드한다. 발송 조건은 등록된 계약 v1 타깃에만 적용한다.
rule_files:
  - /etc/prometheus/rules/*.yml

# V1 앱 EC2(keepgo-01)는 2026-10-27 중지했다. 그 EC2의 node·blackbox·service-health 수집과
# application 타깃(app-host)을 뺐다. V2 ECS는 아래 application-dev job이 수집한다.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  # 계약·기본 대시보드·알림은 미리 준비한다. 앱 구현 확인 후 아래 타깃만 활성화한다.
  # docs/monitoring-metrics-contract.md, monitoring/examples/application-targets.json 참고.
  - job_name: application
    sample_limit: 10000
    label_limit: 40
    file_sd_configs:
      - files: [/etc/prometheus/targets/application.json]
        refresh_interval: 30s

  # Separate job and rules keep development out of the existing production aggregates.
  - job_name: application-dev
    sample_limit: 10000
    label_limit: 40
    file_sd_configs:
      - files: [/etc/prometheus/targets/development.json]
        refresh_interval: 30s
