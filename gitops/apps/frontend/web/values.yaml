# web — Next.js(standalone). 근거: KTB4-8th-FE Dockerfile(3000, USER node, node server.js)
# V2는 S3+CloudFront였고 V3는 클러스터 안 frontend Namespace에서 실행한다(5-2, 5-3 1.2).
component: web

image:
  repository: 602601433533.dkr.ecr.ap-northeast-2.amazonaws.com/keepgo-web

containerPorts:
  - name: http
    port: 3000

# [사실] 헬스 경로가 없어 첫 화면(/)으로 본다(nextjs 프리셋)
probes:
  preset: nextjs

# node 이미지의 node 사용자(1000)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# [가정] 5-3에 web 자원이 없다. Next.js standalone 일반값에서 시작해 측정 후 조정한다.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 256Mi

env:
  LOGGING_LEVEL: null
  JAVA_TOOL_OPTIONS: null
  SERVER_FORWARD_HEADERS_STRATEGY: null
  SERVER_SHUTDOWN: null
  SPRING_LIFECYCLE_TIMEOUTPERSHUTDOWNPHASE: null
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: null
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: null
  HOSTNAME: 0.0.0.0
  PORT: "3000"
  # /api 등은 HTTPRoute가 백엔드로 바로 보내므로 Next.js rewrite는 거의 쓰이지 않는다. 남은 경우를 위해 클러스터 주소를 둔다.
  BACKEND_ORIGIN: http://member-api.account.svc.cluster.local

# [가정] 5-3에 web 확장 방식이 없다 → 일반 API처럼 CPU HPA
autoscaling:
  type: hpa

terminationGracePeriodSeconds: 30

# 나머지 모든 경로(가장 짧은 경로라 API 경로보다 뒤로 밀린다)
httpRoute:
  enabled: true
  pathPrefixes:
    - /
  targetGroup:
    healthCheck:
      path: /
      port: 3000
      httpCode: "200-399"

# [사실] 지표 엔드포인트가 없다
metrics:
  enabled: false
alerts:
  http:
    enabled: false
