name: Deploy production
on:
  push:
    branches: [main]
    paths:
      - deployment/**
      - compose.yaml
      - scripts/**
      - .github/workflows/deploy-production.yaml
  workflow_dispatch:
    inputs:
      mode:
        description: '배포·롤백·미완료 복구·동결·재개 중 선택. 운영 문서 확인 필요'
        type: choice
        options: [deploy, rollback, recover, freeze, resume]
        default: deploy
permissions:
  contents: read
concurrency:
  group: keepgo-production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    # 전달 초안은 S3를 사용한다. 전달 방식과 검사가 준비될 때까지 CD_SETUP_READY를 false로 둔다.
    if: vars.CD_SETUP_READY == 'true' && (vars.CD_ENABLED == 'true' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # 대기 중 실행이 생략될 수 있어 최신 main의 전체 배포 목표를 기준으로 맞춘다.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-duration-seconds: 7200
      - name: Strict validation and unit tests
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        run: |
          python3 scripts/validate-manifest.py
          python3 -m unittest discover -s tests -v
      - name: Execute bounded SSM deployment
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          PRODUCTION_EC2_INSTANCE_ID: ${{ vars.PRODUCTION_EC2_INSTANCE_ID }}
          MODE: ${{ inputs.mode || 'deploy' }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/ssm-deploy.py
      - name: Notify central workflow failure
        if: failure() || cancelled()
        env:
          SNS_TOPIC_ARN: ${{ vars.SNS_TOPIC_ARN }}
        run: |
          aws sns publish --region ap-northeast-2 --topic-arn "$SNS_TOPIC_ARN" \
            --subject "KeepGo v1 CD failure" \
            --message "Check SSM actual state before retry: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-result-${{ github.run_id }}
          path: .artifacts/*.json
          if-no-files-found: ignore
