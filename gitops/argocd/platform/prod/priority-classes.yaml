# PriorityClass(5-3 6.6). 앱 Pod보다 먼저 있어야 Pod가 만들어진다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-priority-classes
  namespace: argocd
  labels:
    keepgo.io/env: prod
    keepgo.io/team: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-8th-CLOUD-GITOPS.git
    targetRevision: main
    path: platform/priority-classes
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
