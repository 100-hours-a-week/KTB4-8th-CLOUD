{{- if and .Values.tests.enabled .Values.service.enabled }}
{{- $port := (index .Values.service.ports 0).port }}
# helm test 로 실행한다. 클러스터 안에서 Service 이름으로 HTTP 요청이 되는지만 확인한다.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "keepgo-app.fullname" . }}-test-connection
  labels:
    {{- include "keepgo-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37
      # 응답 코드가 4xx·5xx여도 연결 자체가 되면 성공으로 본다(경로별 인증 여부와 무관하게 통신만 확인).
      command:
        - sh
        - -c
        - wget -S -q -O /dev/null -T 5 http://{{ include "keepgo-app.fullname" . }}:{{ $port }}/ 2>&1 | grep -q "HTTP/"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
{{- end }}
