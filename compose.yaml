name: keepgo-v1

x-app: &app
  platform: linux/amd64
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    <<: *app
    image: "${AWS_ACCOUNT_ID:?set AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/keepgo-nginx:${NGINX_IMAGE_TAG:?set NGINX_IMAGE_TAG}"
    ports:
      - "80:80"
      - "443:443"
    networks: [web]
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - type: bind
        source: /opt/keepgo/tls
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
      # certbot webroot 갱신용 (nginx.conf의 /.well-known/acme-challenge/)
      - type: bind
        source: /opt/keepgo/acme
        target: /var/www/acme
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *logging

  frontend:
    <<: *app
    image: "${AWS_ACCOUNT_ID:?set AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/keepgo-web:${WEB_IMAGE_TAG:?set WEB_IMAGE_TAG}"
    networks: [web]
    expose: ["3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', {redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  backend:
    <<: *app
    image: "${AWS_ACCOUNT_ID:?set AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/keepgo-backend:${BACKEND_IMAGE_TAG:?set BACKEND_IMAGE_TAG}"
    networks: [web, service]
    expose: ["8080"]
    # 관리 포트(Actuator만). 모니터링 EC2의 Prometheus가 수집한다(TD-024).
    # 앱 SG에서 모니터링 SG만 허용한다. 8080(API)은 게시하지 않는다.
    ports: ["8081:8081"]
    env_file:
      - path: /opt/keepgo/runtime/backend.env
        format: raw
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
      DB_VENDOR: mysql
      # RDS (퍼블릭 액세스 없음, EC2 SG에서만 3306 허용). 엔드포인트는 비밀값이 아니다
      DB_HOST: keepgo-db-v1.c9c2syg08nfm.ap-northeast-2.rds.amazonaws.com
      DB_PORT: "3306"
      DB_NAME: keepgo
      DB_TIMEZONE: Asia/Seoul
      DB_USERNAME: keepgo_app
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_DIALECT: MySQL
      AI_SERVER_API_ADDRESS: http://ai-api:8000
      FRONTEND_SERVER_ADDRESS: https://keepgo.kr
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
      # TLS가 nginx에서 끝나므로 X-Forwarded-* 로 원래 https 주소를 복원
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # nginx client_max_body_size와 맞춘다 (Spring 기본 1MB)
      SPRING_SERVLET_MULTIPART_MAXFILESIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAXREQUESTSIZE: 10MB
      # 이미지에 pem이 없으므로 prepare-runtime.py가 만든 파일로 덮어쓴다
      KEEPGO_SECURITY_JWT_PUBLICKEY: file:/run/secrets/jwt_public_key.pem
      KEEPGO_SECURITY_JWT_PRIVATEKEY: file:/run/secrets/jwt_private_key.pem
    secrets:
      - source: jwt_public_key
        target: jwt_public_key.pem
      - source: jwt_private_key
        target: jwt_private_key.pem
    volumes:
      # 프로필 사진 업로드. 호스트 디렉터리는 10001 소유
      - type: bind
        source: /opt/keepgo/data/uploads
        target: /app/uploads
        bind:
          create_host_path: false
    depends_on:
      ai-api:
        condition: service_started
    mem_limit: 1024m
    stop_grace_period: 30s
    # Spring Actuator /actuator/health가 UP이어야 한다(DB 연결 포함). 이미지에 curl이 없어 bash로 요청한다.
    # 관리 포트 전환 기간: 8081(새 이미지)을 먼저 보고 실패하면 8080(기존 이미지)을 본다.
    # 8081 이미지가 정착하면 8080을 지운다. 각 시도를 subshell로 감싸 연결 실패가 다음 시도를 막지 않게 한다.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          for port in 8081 8080; do
          ( exec 3<>/dev/tcp/127.0.0.1/$$port
          && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3 ) 2>/dev/null && exit 0;
          done; exit 1
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 90s
    logging: *logging

  ai-api:
    <<: *app
    image: "${AWS_ACCOUNT_ID:?set AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/keepgo-ai:${AI_IMAGE_TAG:?set AI_IMAGE_TAG}"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [service]
    expose: ["8000"]
    # metrics 전용 포트. AI API(8000)는 인증이 없어 게시하지 않는다(TD-024).
    ports: ["9464:9464"]
    env_file:
      - path: /opt/keepgo/runtime/ai.env
        format: raw
        required: true
    environment:
      LLM_PROVIDER: google
      GOOGLE_MODEL: gemini-3.8-flash
      EMBEDDING_PROVIDER: google
      CHROMA_PATH: /app/chroma
      LANGSMITH_TRACING: "true"
      LANGSMITH_WORKSPACE_ID: 3839065b-21f0-4891-857e-e81695ab40e5
      LANGSMITH_PROJECT: keepgo
    mem_limit: 768m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

secrets:
  jwt_public_key:
    file: /opt/keepgo/runtime/jwt/public_key.pem
  jwt_private_key:
    file: /opt/keepgo/runtime/jwt/private_key.pem

networks:
  web: {}
  service: {}
