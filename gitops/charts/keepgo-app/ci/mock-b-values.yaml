# kind·CI 검증용 Mock B: fastapi 프리셋(8000 포트, /health/live·/health/ready)
# A와 포트·프리셋·종료 시간·우선순위가 달라도 차트 수정 없이 반영되는지 확인한다.
# helm install mock-b gitops/charts/keepgo-app -n mock \
#   -f gitops/charts/keepgo-app/ci/mock-b-values.yaml

image:
  repository: hashicorp/http-echo
  tag: "1.0"

args:
  - -listen=:8000
  - -text=mock-b

containerPorts:
  - name: http
    port: 8000

probes:
  preset: fastapi
  # 프리셋 값 중 일부만 덮어쓰는 예
  startup:
    failureThreshold: 6

service:
  ports:
    - name: http
      port: 8000
      targetPort: http

env:
  LOGGING_LEVEL: null
  JAVA_TOOL_OPTIONS: null
  SERVER_FORWARD_HEADERS_STRATEGY: null
  SERVER_SHUTDOWN: null
  SPRING_LIFECYCLE_TIMEOUTPERSHUTDOWNPHASE: null
  MOCK_NAME: mock-b

lifecycle:
  preStopSleepSeconds: 5
terminationGracePeriodSeconds: 20

priorityClassName: keepgo-high

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 32Mi
