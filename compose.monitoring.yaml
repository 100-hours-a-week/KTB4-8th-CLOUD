# 모니터링 전용 EC2(t4g.small, arm64)에서 실행한다(TD-024).
# 앱 EC2의 exporter·수집 포트는 compose.exporters.yaml과 compose.yaml이 게시한다.
# APP_HOST_PRIVATE_IP: 앱 EC2 private IP. prometheus.yml은 IP 대신 app-host 이름만 쓴다.
#   docker compose --env-file /opt/keepgo/runtime/monitoring-host.env -f compose.monitoring.yaml up -d
name: keepgo-monitoring

x-common: &common
  platform: linux/arm64
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  prometheus:
    <<: *common
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitoring]
    extra_hosts:
      - "app-host:${APP_HOST_PRIVATE_IP:?set APP_HOST_PRIVATE_IP}"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana:
    <<: *common
    image: grafana/grafana:13.2.2
    ports: ["127.0.0.1:3001:3000"]
    networks: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    env_file:
      - path: /opt/keepgo/runtime/monitoring.env
        format: raw
        required: true
    secrets: [grafana_admin_password]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

secrets:
  grafana_admin_password:
    file: /opt/keepgo/runtime/grafana_admin_password

volumes:
  prometheus-data: {}
  grafana-data: {}

networks:
  monitoring: {}
