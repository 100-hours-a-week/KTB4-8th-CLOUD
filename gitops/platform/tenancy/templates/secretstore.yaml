{{- $s := .Values.secretStore }}
{{- if $s.enabled }}
{{- range $ns, $cfg := .Values.namespaces }}
---
# 이 Namespace의 ExternalSecret이 쓰는 연결. 팀은 Namespace별 IAM 역할이 허용한 경로만 읽는다.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $s.name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: keepgo
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $s.region }}
      {{- if $s.roleArnFormat }}
      role: {{ printf $s.roleArnFormat $.Values.cluster $ns }}
      {{- end }}
{{- end }}
{{- end }}
