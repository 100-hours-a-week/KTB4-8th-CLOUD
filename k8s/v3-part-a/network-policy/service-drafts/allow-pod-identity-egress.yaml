# 초안: ingest의 두 서비스가 EKS Pod Identity를 사용하는 경우의 자격 증명 조회 예외입니다. 다른 Namespace의 AWS 접근은 실제 필요 시 추가합니다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-youtube-api-and-worker-pod-identity
  namespace: ingest
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - youtube-api
      - youtube-analysis-worker
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 169.254.170.23/32
    ports:
    - protocol: TCP
      port: 80
