{{- if .Values.serviceAccount.create }}
# Pod의 신원. AWS 권한(S3·SQS·Secrets Manager 등)은 EKS Pod Identity로 이 ServiceAccount에 IAM 역할을 연결해서 준다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keepgo-app.serviceAccountName" . }}
  labels:
    {{- include "keepgo-app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
