AWSTemplateFormatVersion: '2010-09-09'
# 기존 리소스와 역할을 확인하고 change set으로 검토한다. S3 리소스는 만들지 않는다.
Description: KeepGo Backend central CD via SSM and fixed Git revision
Parameters:
  GitHubRepository:
    Type: String
    Default: 100-hours-a-week/KTB4-8th-CLOUD
  GitHubOidcProviderArn:
    Type: String
  InstanceId:
    Type: AWS::EC2::Instance::Id
  InstanceRoleName:
    Type: String
    Description: AmazonSSMManagedInstanceCore가 있는 기존 EC2 역할 이름. 배포 권한을 추가한다.
  AlertsTopicArn:
    Type: String
    Default: ''
  AppSecretArns:
    Type: CommaDelimitedList
    Description: prepare-runtime.py가 읽는 Secret-v1-BE와 Secret-v1-AI의 정확한 ARN 목록.
Conditions:
  HasAlerts: !Not [!Equals [!Ref AlertsTopicArn, '']]
Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:environment:production'
      Policies:
        - PolicyName: CentralDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}'
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
              - !If
                - HasAlerts
                - {Effect: Allow, Action: 'sns:Publish', Resource: !Ref AlertsTopicArn}
                - !Ref AWS::NoValue
  VerifyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubRepository}:pull_request'
      Policies:
        - PolicyName: ImageVerification
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:DescribeImages
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/keepgo-*'
  MonitorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
      Policies:
        - PolicyName: ExternalHealthMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition: {StringEquals: {cloudwatch:namespace: KeepGo/V1}}
  HostPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: KeepGoV1Runtime
      Roles: [!Ref InstanceRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action: [ecr:DescribeImages, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
            Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/keepgo-*'
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref AppSecretArns
          - !If
            - HasAlerts
            - {Effect: Allow, Action: 'sns:Publish', Resource: !Ref AlertsTopicArn}
            - !Ref AWS::NoValue
          - Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: '*'
            Condition: {StringEquals: {cloudwatch:namespace: KeepGo/V1}}
          - Effect: Allow
            Action: cloudwatch:DescribeAlarms
            Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*'
Outputs:
  DeployRoleArn: {Value: !GetAtt DeployRole.Arn}
  VerifyRoleArn: {Value: !GetAtt VerifyRole.Arn}
  MonitorRoleArn: {Value: !GetAtt MonitorRole.Arn}
