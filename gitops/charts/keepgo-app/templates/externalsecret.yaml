{{- /*
비밀값은 Git에 두지 않는다(5-4 10장). Git에는 "어떤 키를 어디서 가져올지"만 있고,
External Secrets Operator가 AWS Secrets Manager 값을 읽어 쿠버네티스 Secret을 만든다.
store는 tenancy 차트가 Namespace마다 만드는 SecretStore를 가리킨다.
Deployment보다 먼저 만들어지도록 sync-wave를 앞당긴다(5-4 6.5).
Secret 이름은 "<서비스>-<items[].name>"이다. 같은 Namespace의 두 서비스(auth·member)가
같은 공통 values를 써도 이름이 겹치지 않게 하기 위해서다.
  asEnv: true      → 모든 키를 환경변수로(envFrom)
  asFiles: {...}   → 파일로 마운트(JWT PEM 등)
*/}}
{{- $es := .Values.externalSecrets }}
{{- range $es.items }}
{{- if and .asFiles (not .asFiles.mountPath) }}
{{- fail (printf "externalSecrets.items[%s].asFiles.mountPath가 필요합니다" .name) }}
{{- end }}
{{- if not .name }}
{{- fail "externalSecrets.items[].name(만들 Secret 이름)이 필요합니다" }}
{{- end }}
{{- if not (or .data .dataFrom) }}
{{- fail (printf "externalSecrets.items[%s]에 data 또는 dataFrom이 필요합니다" .name) }}
{{- end }}
{{- $secretName := printf "%s-%s" (include "keepgo-app.fullname" $) .name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "keepgo-app.labels" $ | nindent 4 }}
  annotations:
    {{- if and $.Values.migration.enabled (eq .name $.Values.migration.externalSecret) }}
    # 마이그레이션 Job(PreSync)보다 먼저 있어야 하므로 이 항목도 PreSync Hook으로 만든다.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- end }}
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .refreshInterval | default $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml (.storeRef | default $es.storeRef) | nindent 4 }}
  target:
    name: {{ $secretName }}
    # ExternalSecret을 지우면 만든 Secret도 같이 지운다.
    creationPolicy: Owner
  {{- with .data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
