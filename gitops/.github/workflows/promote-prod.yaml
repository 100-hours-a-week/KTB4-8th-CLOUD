# prod 승격(5-4 5.2). dev에서 확인한 같은 이미지(다시 빌드하지 않음)를 prod values로 올리는 PR을 만든다.
#   1) ECR에 태그가 있는지, Critical 취약점이 없는지 확인(5-4 4.3)
#   2) 같은 이미지에 prod-<SHA> 태그 추가(롤백용으로 lifecycle에서 보존)
#   3) values-prod 태그 변경 PR → 해당 팀 + 플랫폼팀 승인(CODEOWNERS) → merge → prod Argo CD 반영
name: promote-prod

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "올릴 이미지"
        type: choice
        options: [backend, ai, web]
        required: true
      tag:
        description: "dev에서 확인한 이미지 태그(커밋 SHA)"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: promote-prod-${{ inputs.stack }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: 대상 결정
        id: target
        run: |
          case "${{ inputs.stack }}" in
            backend) echo "repo=keepgo-backend" >> "$GITHUB_OUTPUT"; echo "files=apps/_shared/spring-prod.yaml" >> "$GITHUB_OUTPUT" ;;
            ai)      echo "repo=keepgo-ai"      >> "$GITHUB_OUTPUT"; echo "files=apps/ai/ai-api/values-prod.yaml" >> "$GITHUB_OUTPUT" ;;
            web)     echo "repo=keepgo-web"     >> "$GITHUB_OUTPUT"; echo "files=apps/frontend/web/values-prod.yaml" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # ECR 조회·태그 추가만 가능한 역할(클러스터 권한 없음)
          role-to-assume: ${{ secrets.ECR_PROMOTE_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 이미지·취약점 확인
        env:
          REPO: ${{ steps.target.outputs.repo }}
          TAG: ${{ inputs.tag }}
        run: |
          aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null
          critical=$(aws ecr describe-image-scan-findings --repository-name "$REPO" --image-id imageTag="$TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text 2>/dev/null || echo "None")
          if [ "$critical" != "None" ] && [ "$critical" != "0" ]; then
            echo "Critical 취약점 ${critical}건: prod 승격을 막는다(5-4 4.3)"; exit 1
          fi

      - name: prod-<SHA> 태그 추가
        env:
          REPO: ${{ steps.target.outputs.repo }}
          TAG: ${{ inputs.tag }}
        run: |
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="prod-$TAG" >/dev/null 2>&1; then
            echo "이미 prod-$TAG 태그가 있다"; exit 0
          fi
          manifest=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$TAG" \
            --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name "$REPO" --image-tag "prod-$TAG" --image-manifest "$manifest" >/dev/null

      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: values-prod 변경 PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag }}
          FILES: ${{ steps.target.outputs.files }}
          STACK: ${{ inputs.stack }}
        run: |
          branch="promote/${STACK}-${TAG:0:12}"
          git config user.name "keepgo-gitops-bot"
          git config user.email "keepgo-gitops-bot@users.noreply.github.com"
          git switch -c "$branch"
          bash scripts/set-image-tag.sh "$TAG" $FILES
          if git diff --quiet; then echo "prod가 이미 이 태그다"; exit 0; fi
          git commit -am "release(prod): ${STACK} ${TAG:0:12}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "release(prod): ${STACK} ${TAG:0:12}" \
            --body "dev에서 확인한 이미지 \`${TAG}\`를 prod로 올린다. 이미지는 다시 빌드하지 않았다(digest 동일). 확인: Argo CD dev Healthy, 스모크 테스트(5-4 5.2)."
