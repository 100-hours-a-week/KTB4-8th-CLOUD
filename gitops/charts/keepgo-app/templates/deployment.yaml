{{- $startup := include "keepgo-app.probe" (dict "root" . "kind" "startup") -}}
{{- $readiness := include "keepgo-app.probe" (dict "root" . "kind" "readiness") -}}
{{- $liveness := include "keepgo-app.probe" (dict "root" . "kind" "liveness") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keepgo-app.fullname" . }}
  labels:
    {{- include "keepgo-app.labels" . | nindent 4 }}
spec:
  {{- /* HPA·KEDA를 쓰면 replicas를 그리지 않는다. Git 값과 오토스케일러 값이 서로 덮어쓰지 않게(5-4 6.4) */}}
  {{- if eq (include "keepgo-app.autoscalingType" .) "none" }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "keepgo-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keepgo-app.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations .Values.configFiles.files }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.configFiles.files }}
        checksum/config: {{ toYaml . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "keepgo-app.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: {{ include "keepgo-app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerPorts }}
          ports:
            {{- range . }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
          {{- end }}
          {{- if or .Values.env .Values.extraEnv }}
          env:
            {{- /* 맵은 키 이름 순으로 그려져 렌더링 결과가 매번 같다(Argo CD Drift 방지) */}}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- $esEnv := list }}
          {{- range .Values.externalSecrets.items }}
          {{- if .asEnv }}
          {{- $esEnv = append $esEnv (dict "secretRef" (dict "name" (printf "%s-%s" (include "keepgo-app.fullname" $) .name))) }}
          {{- end }}
          {{- end }}
          {{- if or .Values.envFrom $esEnv }}
          envFrom:
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $esEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $startup }}
          startupProbe:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with $readiness }}
          readinessProbe:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with $liveness }}
          livenessProbe:
            {{- . | nindent 12 }}
          {{- end }}
          {{- if gt (int .Values.lifecycle.preStopSleepSeconds) 0 }}
          lifecycle:
            # 이미지에 sleep 명령이 없어도 되도록 쿠버네티스 기본 sleep 동작을 쓴다(1.30+).
            preStop:
              sleep:
                seconds: {{ .Values.lifecycle.preStopSleepSeconds }}
          {{- end }}
          resources:
            {{- include "keepgo-app.resources" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if or .Values.tmpDir.enabled .Values.secretFiles .Values.configFiles.files .Values.extraVolumes (include "keepgo-app.esFiles" .) }}
          volumeMounts:
            {{- if .Values.tmpDir.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- range .Values.secretFiles }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.configFiles.files }}
            - name: config
              mountPath: {{ .Values.configFiles.mountPath }}
              readOnly: true
            {{- end }}
            {{- range .Values.extraVolumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
            {{- range .Values.externalSecrets.items }}
            {{- if .asFiles }}
            - name: es-{{ .name }}
              mountPath: {{ .asFiles.mountPath }}
              readOnly: true
            {{- end }}
            {{- end }}
          {{- end }}
      {{- if or .Values.tmpDir.enabled .Values.secretFiles .Values.configFiles.files .Values.extraVolumes (include "keepgo-app.esFiles" .) }}
      volumes:
        {{- if .Values.tmpDir.enabled }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpDir.sizeLimit }}
        {{- end }}
        {{- range .Values.secretFiles }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secretName }}
            {{- with .items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
        {{- if .Values.configFiles.files }}
        - name: config
          configMap:
            name: {{ include "keepgo-app.fullname" . }}-config
        {{- end }}
        {{- range .Values.extraVolumes }}
        - name: {{ .name }}
          emptyDir:
            sizeLimit: {{ .sizeLimit }}
        {{- end }}
        {{- range .Values.externalSecrets.items }}
        {{- if .asFiles }}
        - name: es-{{ .name }}
          secret:
            secretName: {{ printf "%s-%s" (include "keepgo-app.fullname" $) .name }}
            {{- with .asFiles.items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.topologySpread.node.enabled .Values.topologySpread.zone.enabled }}
      # 배포 중에는 새 버전 Pod끼리만 비교한다(matchLabelKeys). 구버전 Pod 때문에 한쪽으로 몰리지 않게.
      topologySpreadConstraints:
        {{- with .Values.topologySpread.node }}
        {{- if .enabled }}
        # 노드 기준 Soft
        - maxSkew: {{ .maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "keepgo-app.selectorLabels" $ | nindent 14 }}
          matchLabelKeys:
            - pod-template-hash
        {{- end }}
        {{- end }}
        {{- with .Values.topologySpread.zone }}
        {{- if .enabled }}
        # AZ 기준 Hard (핵심 API만)
        - maxSkew: {{ .maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "keepgo-app.selectorLabels" $ | nindent 14 }}
          matchLabelKeys:
            - pod-template-hash
        {{- end }}
        {{- end }}
      {{- end }}
