name: Validate deployment
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  configuration:
    name: configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check syntax, configuration and deployment failure scenarios
        run: |
          python3 -m compileall -q scripts tests
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/validate-manifest.py --structure-only
          python3 -m unittest discover -s tests -v
      - name: Validate workflow syntax
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
  validate:
    # main에서 사용하던 필수 검사 이름도 유지한다.
    name: Validate manifest and compose
    needs: configuration
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.configuration.result }}
        run: test "$RESULT" = success
