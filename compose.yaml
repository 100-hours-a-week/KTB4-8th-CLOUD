name: keepgo-v1

x-app: &app
  platform: linux/amd64
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    <<: *app
    image: "${AWS_ACCOUNT_ID:?set AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/keepgo-nginx:${NGINX_IMAGE_TAG:?set NGINX_IMAGE_TAG}"
    ports:
      - "80:80"
      - "443:443"
    networks: [web]
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - type: bind
        source: /opt/keepgo/tls
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *logging

  frontend:
    <<: *app
    image: "${AWS_ACCOUNT_ID:?set AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/keepgo-web:${WEB_IMAGE_TAG:?set WEB_IMAGE_TAG}"
    networks: [web]
    expose: ["3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', {redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  backend:
    <<: *app
    image: "${AWS_ACCOUNT_ID:?set AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/keepgo-backend:${BACKEND_IMAGE_TAG:?set BACKEND_IMAGE_TAG}"
    networks: [web, service, database]
    expose: ["8080"]
    env_file:
      - path: /opt/keepgo/runtime/backend.env
        format: raw
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_VENDOR: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: keepgo
      DB_TIMEZONE: Asia/Seoul
      DB_USERNAME: keepgo_app
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_DIALECT: MySQL
      AI_SERVER_API_ADDRESS: http://ai-api:8000
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
    depends_on:
      db:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    mem_limit: 1024m
    stop_grace_period: 30s
    # Until BE provides an HTTP readiness endpoint, this only checks that port 8080 is open.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 90s
    logging: *logging

  ai-api:
    <<: *app
    image: "${AWS_ACCOUNT_ID:?set AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/keepgo-ai:${AI_IMAGE_TAG:?set AI_IMAGE_TAG}"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [service]
    expose: ["8000"]
    env_file:
      - path: /opt/keepgo/runtime/ai.env
        format: raw
        required: true
    environment:
      LLM_PROVIDER: google
      GOOGLE_MODEL: gemini-3.8-flash
      EMBEDDING_PROVIDER: google
      CHROMA_PATH: /app/chroma
    mem_limit: 768m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  db:
    <<: *app
    image: mysql:8.4
    networks: [database]
    environment:
      MYSQL_DATABASE: keepgo
      MYSQL_USER: keepgo_app
      MYSQL_PASSWORD_FILE: /run/secrets/database_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/database_root_password
    secrets:
      - database_password
      - database_root_password
    command: ["--innodb-buffer-pool-size=536870912"]
    volumes:
      - type: bind
        source: /opt/keepgo/data/mysql
        target: /var/lib/mysql
        bind:
          create_host_path: false
    mem_limit: 1024m
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/database_root_password)\" mysql --protocol=tcp -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

secrets:
  database_password:
    file: /opt/keepgo/runtime/database-password
  database_root_password:
    file: /opt/keepgo/runtime/database-root-password

networks:
  web: {}
  service: {}
  database:
    internal: true
