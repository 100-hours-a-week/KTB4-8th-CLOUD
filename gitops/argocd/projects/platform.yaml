# platform 프로젝트(5-4 6.3): 클러스터 공통 리소스(CRD, ClusterRole, Namespace, 컨트롤러)를 만들 수 있는 유일한 프로젝트
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: 클러스터 공통 컴포넌트와 정책(플랫폼팀)
  sourceRepos:
    - https://github.com/100-hours-a-week/KTB4-8th-CLOUD-GITOPS.git
    - https://kedacore.github.io/charts
    - https://charts.external-secrets.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  # 동기화는 bootstrap에서 만든 argocd-platform-deployer(cluster-admin)로 한다.
  destinationServiceAccounts:
    - server: https://kubernetes.default.svc
      namespace: "*"
      defaultServiceAccount: argocd:argocd-platform-deployer
