apiVersion: karpenter.k8s.aws/v1

kind: EC2NodeClass

metadata:
  name: keepgo-dev3-application
  labels:
    app.kubernetes.io/part-of: keepgo
    environment: dev

spec:
  amiFamily: AL2023

  amiSelectorTerms:
    - id: ami-028c3be84a60f65c7

  role: keepgo-dev3-karpenter-node-role

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: keepgo-dev3-eks
  securityGroupSelectorTerms:
    - id: sg-094cc466e3b468087

  associatePublicIPAddress: false

  metadataOptions:
    httpEndpoint: enabled

    httpProtocolIPv6: disabled
    httpTokens: required
    httpPutResponseHopLimit: 1

  kubelet:
    maxPods: 110

  blockDeviceMappings:
    - deviceName: /dev/xvda

      ebs:
        volumeType: gp3

        volumeSize: 30Gi

        encrypted: true

        deleteOnTermination: true

  tags:
    Name: keepgo-dev3-application-node
    Project: keepgo
    Environment: dev
    Cluster: keepgo-dev3-eks
    Workload: application
