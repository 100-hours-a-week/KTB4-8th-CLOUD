apiVersion: karpenter.sh/v1
kind: NodePool

metadata:
  name: keepgo-dev3-worker
  labels:
    app.kubernetes.io/part-of: keepgo
    environment: dev

spec:
  template:
    metadata:
      # Worker Pod가 선택할 실제 노드 라벨
      labels:
        workload: worker
        environment: dev

    spec:
      # Worker용 디스크 50GiB 등을 정의한 NodeClass 연결
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: keepgo-dev3-worker

      # 해당 Taint를 허용하는 Pod만 새로 배치
      # 일반 API Pod가 Worker 노드에 배치되는 것을 제한
      taints:
        - key: workload
          value: worker
          effect: NoSchedule

      requirements:
        - key: kubernetes.io/os
          operator: In
          values: [linux]

        - key: kubernetes.io/arch
          operator: In
          values: [amd64]

        - key: topology.kubernetes.io/zone
          operator: In
          values: [ap-northeast-2a, ap-northeast-2c]

        # Spot과 On-Demand 모두 허용
        # Karpenter가 Spot을 우선하고 확보가 어려우면 대체
        # 배열의 작성 순서가 우선순위를 만드는 것은 아님
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]

        # Spot 후보를 넓히기 위해 T·C·M·R 계열 허용
        # T(버스트)·C(연산)·M(범용)·R(메모리) 계열을 폭넓게 허용
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [t, c, m, r]

        # 세대 번호 제한은 제거. amd64·Nitro 호환 조건은 유지

        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values: [nitro]

        # 개별 노드의 CPU 후보
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4"]

      # 노드 수명 30일
        # t3.medium 수준의 최소 메모리 4GiB 확보 (단위 MiB)
        - key: karpenter.k8s.aws/instance-memory
          operator: Gt
          values: ["4095"]

      expireAfter: 720h

      # 노드 종료 처리의 최대 드레이닝 시간
      # AWS Spot 회수 예고 시간을 5분으로 늘려주지는 않음
      terminationGracePeriod: 5m

  # Spot·On-Demand를 합친 Worker 전체 노드 용량 상한
  limits:
    cpu: "8"
    memory: 32Gi

  disruption:
    # 비어 있거나, Pod 재배치로 비용을 줄일 수 있는 노드 검토
    consolidationPolicy: WhenEmptyOrUnderutilized

    # Pod 추가·삭제 이후 통합 판단까지 대기
    consolidateAfter: 5m

    # 예산이 적용되는 자발적 중단은 동시에 최대 1개
    budgets:
      - nodes: "1"
